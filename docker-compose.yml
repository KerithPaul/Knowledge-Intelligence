# Qdrant server. The Python client in pyproject.toml is pinned to this release.
# The app service and Dockerfile arrive in Phase 7.
#
# On Windows, Qdrant needs a named volume. A bind mount of a Windows folder
# is not a POSIX filesystem, and Qdrant refuses to start on it.

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: knowledge-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
